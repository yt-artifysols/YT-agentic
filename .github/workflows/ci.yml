name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - run: uv venv .venv --python 3.12 && uv pip install -p .venv -e '.[dev,hub,youtube]'
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Transitions seed matches states.py
        run: make check-generated
      - name: Applied migrations unchanged vs main
        run: |
          git fetch --no-tags origin main || true
          make check-migrations

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv .venv --python 3.12 && uv pip install -p .venv -e '.[dev,hub,youtube]'
      - name: Unit and Temporal (time-skipping) tests
        run: make test

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ytcore
          POSTGRES_PASSWORD: ytcore-ci  # gitleaks:allow (ephemeral CI container)
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ytcore" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: ytcore
      PGPASSWORD: ytcore-ci  # gitleaks:allow (ephemeral CI container)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv .venv --python 3.12 && uv pip install -p .venv -e '.[dev,hub,youtube]'
      - name: Install psql
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - name: Migrations + schema guard tests
        run: make test-db
      - name: Pipeline and gateway integration tests (real Postgres)
        run: make test-integration

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, pinned and checksum-verified)
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
      - uses: astral-sh/setup-uv@v3
      - run: uv venv .venv --python 3.12 && uv pip install -p .venv -e '.[dev,hub,youtube]'
      - name: Dependency audit
        run: make audit

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive infra/terraform
      - run: make tf-validate
