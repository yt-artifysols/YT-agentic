# Generated by ytcore/observability/dashboards.py. Do not edit.
groups:
  - name: ytcore
    rules:
      - alert: YtcoreJobsStuck
        expr: sum(ytcore_queue_depth{state=~"researching|scripting|rendering|qa"}) > 0 and max(ytcore_stage_latency_seconds{quantile="p95"}) > 2700
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "Jobs are sitting in an automated stage for over 45 minutes (see job.stuck alerts)"
      - alert: YtcoreApprovalBacklog
        expr: ytcore_queue_depth{state="awaiting_approval"} > 10
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "More than 10 videos are waiting for a human approval"
      - alert: YtcoreBudgetBreach
        expr: max(ytcore_cost_per_video_cents) > 1500
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Average cost per video above the pilot ceiling (15 USD)"
      - alert: YtcoreGatewayFailures
        expr: ytcore_uploads_failed_1h > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The YouTube gateway failed an upload in the last hour"
      - alert: YtcoreQuotaHigh
        expr: max(ytcore_quota_used_ratio) > 0.8
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "A Google project has used over 80% of today's YouTube API quota"
      - alert: YtcoreHighReworkRate
        expr: ytcore_rework_rate > 1.5
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "QA rework loops per job are high: check prompts, sources and policy rules"
      - alert: YtcoreMetricsDown
        expr: absent(ytcore_queue_depth{state="planned"})
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The ytcore metrics exporter is not reporting"
