[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ytcore"
version = "0.1.0"
description = "Agentic control system for multi-channel YouTube video production with mandatory human approval."
requires-python = ">=3.12"
dependencies = [
  "cryptography>=43",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "temporalio>=1.8",
  "opentelemetry-api>=1.27",
  "pyyaml>=6",
  "httpx>=0.27",  # the worker calls the gateway service over HTTP
]

[project.scripts]
ytctl = "ytcore.cli:main"

[project.optional-dependencies]
hub = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "webauthn>=2.2",
]
gateway = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "google-auth>=2.30",
]
agents = [
  "anthropic>=1.13",
]
otel = [
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]
gcp = [
  "google-cloud-storage>=2.18",
  "google-cloud-secret-manager>=2.20",
  "google-cloud-kms>=2.24",
]
youtube = [
  "google-api-python-client>=2.140",
  "google-auth>=2.30",
]
dev = [
  "jsonschema>=4.23",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "opentelemetry-sdk>=1.27",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["ytcore"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["infra/terraform"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests and guards

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ytcore"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml", "googleapiclient.*", "google.oauth2.*", "google.cloud.*", "opentelemetry.exporter.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: needs a real Postgres (PG* env); skipped when unavailable unless REQUIRE_DB=1",
  "chaos: kills real worker processes and restarts a local Temporal server (slower)",
]
asyncio_default_fixture_loop_scope = "function"
